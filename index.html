<style>
/* Layout: dark green sidebar + white top bar on desktop; compact top bar + 5-item bottom bar + thumb-reach add button on phone */
:root{
  /* Intrend palette, single light theme */
  --bg:#F5F7F5; --surface:#FFFFFF; --fg:#192B28; --muted:#6F817B; --line:#E5EBE7;
  --primary:#17684D; --primary-fg:#FFFFFF; --primary-soft:#E5F3EC;
  --side:#183B31; --side-hi:#2A5947; --side-hover:#295244; --side-line:#436255; --side-fg:#D8E7E1; --side-mute:#AFC7BD;
  --ok-bg:#EAF4EB; --ok-fg:#247A53; --warn-bg:#FFF1DA; --warn-fg:#A66A20;
  --err-bg:#FCE5E5; --err-fg:#8E1F1F; --info-bg:#E4EEF3; --info-fg:#1F4A5E;
  --track:#EDF2EE; --fill:#247B5C; --soft:#F8FAF8; --thbg:#F9FBF9; --thfg:#6C7F77;
  --hl:#E8F4EC; --hl-line:#CDE7D7; --input-line:#DCE5DF; --tile:#E7F3EA; --toast:#1F624A; --label:#415950; --navmute:#7B8C83;
  --shadow:0 10px 35px rgba(18,46,37,.045);
  --f-body:Inter,'Noto Sans Thai','Noto Sans SC',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
:root[data-ui="dark"]{
  --bg:#0F1A17; --surface:#172420; --fg:#E6EFEA; --muted:#9DB0A8; --line:#2A3B35;
  --primary:#3FB68B; --primary-fg:#06231A; --primary-soft:#1B3029;
  --side:#0B1512; --side-hi:#1F3A30; --side-hover:#1A3128; --side-line:#2A3B35; --side-fg:#D0E2DA; --side-mute:#8DA89D;
  --ok-bg:#17382C; --ok-fg:#8FE0BC; --warn-bg:#3B3014; --warn-fg:#F2CC7A;
  --err-bg:#3F1D1D; --err-fg:#F5A9A9; --info-bg:#1B3140; --info-fg:#9CC8E0;
  --track:#2A3B35; --fill:#3FB68B; --soft:#13201C; --thbg:#13201C; --thfg:#9DB0A8;
  --hl:#17382C; --hl-line:#2A4A3C; --input-line:#2A3B35; --tile:#1B3029; --toast:#2F7A5E; --label:#B9CCC4; --navmute:#8DA89D;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #90C8AF;outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}

/* shell */
.app{display:flex;min-height:100%}
.sidebar{width:244px;background:var(--side);color:var(--side-fg);position:fixed;inset:0 auto 0 0;padding:23px 15px;display:flex;flex-direction:column;gap:18px;z-index:30;overflow-y:auto}
.sbrand{padding:5px 13px 17px;border-bottom:1px solid var(--side-line)}
.sbrand strong{font-size:21px;letter-spacing:1px;color:#fff}
.sbrand small{display:block;color:var(--side-mute);font-size:10px;letter-spacing:1.5px;margin-top:3px}
.navh{font-size:10px;color:var(--side-mute);letter-spacing:1.2px;margin:2px 12px 6px;text-transform:uppercase}
.nav{display:grid;gap:4px}
.nav button{width:100%;text-align:left;padding:11px 13px;border:0;background:transparent;color:var(--side-fg);border-radius:10px;display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer;min-height:44px}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-hi);color:#fff;font-weight:700}
.nav i{font-style:normal;width:18px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:1px 8px;border-radius:99px}
.sidefoot{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 12px;color:var(--side-mute);font-size:12px}
.main{margin-left:244px;width:calc(100% - 244px);min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:72px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:15px;padding-inline:30px}
.tb-brand{font-size:13px;font-weight:700;white-space:nowrap}
.tb-brand span{font-weight:400;color:var(--muted)}
.gsearch{flex:1;max-width:440px;min-height:40px;border-radius:10px;background:var(--bg);margin-left:auto}
.tb-r{display:flex;gap:8px;align-items:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--info-bg);color:var(--info-fg);min-height:28px;white-space:nowrap}
.status.saved{background:var(--ok-bg);color:var(--ok-fg)}
.status.saving{background:var(--warn-bg);color:var(--warn-fg)}
.status.error{background:var(--err-bg);color:var(--err-fg)}
.content{max-width:1380px;margin-inline:auto;padding:32px 32px 96px}
#view{display:flex;flex-direction:column;gap:16px}
.mobilebar{display:none}

/* page heads */
.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:800;color:var(--primary)}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pagehead h1{font-size:29px;line-height:1.3;margin:5px 0 4px;letter-spacing:-.5px}
.pagehead .sub{color:var(--muted);font-size:13px;margin:0}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.banner{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:700}
.btn.danger{color:var(--err-fg);background:var(--err-bg);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:25;min-height:56px;padding:0 22px;border-radius:99px;box-shadow:0 7px 25px rgba(23,77,55,.45);font-size:15px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--label);min-width:0}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--input-line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:14px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:22px;min-height:22px;height:22px;accent-color:var(--primary);flex:none}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 200px}
.search select{flex:1 1 130px;min-width:0}
.search .btn{flex:0 0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:0 14px;min-height:36px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.err{background:var(--err-bg);color:var(--err-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)}
.pill.solid{background:var(--primary);color:var(--primary-fg)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi,.card,.item,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.kpi{padding:19px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-size:28px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:6px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi small{font-size:11px;color:var(--primary);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--fill);border-radius:99px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.panel{padding:21px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:16px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0;padding-block:8px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row>*{min-width:0}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{display:flex;gap:12px;align-items:center;padding:13px;background:var(--soft);border:1px solid var(--line);border-radius:12px;min-width:0}
.step .n{background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:12px;flex:none}
.step b{font-size:13px}.step small{display:block;color:var(--muted);line-height:1.5}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.grid.list{grid-template-columns:1fr}
@media(max-width:760px){.grid.pcards:not(.list){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid.pcards:not(.list) .card .nm{font-size:14px}.grid.pcards:not(.list) .card .meta{flex-wrap:wrap;gap:4px}.grid.pcards:not(.list) .card .ph{font-size:26px}}
.card{overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;text-align:left;padding:0}
.card .ph{aspect-ratio:4/3;background:var(--tile);display:grid;place-items:center;color:var(--primary);font-size:34px;font-weight:700;overflow:hidden;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.grid.list .card{flex-direction:row}
.grid.list .card .ph{aspect-ratio:1;width:96px;flex:none;font-size:24px}
.card .bd{padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.card .nm{font-weight:700;overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.price{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.item{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .hd>*{min-width:0}
.item .ops{display:flex;gap:8px;flex-wrap:wrap}
.zone{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.done .nm{text-decoration:line-through;color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--thfg);font-weight:600;white-space:nowrap;background:var(--thbg)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--err-fg)}.pos{color:var(--ok-fg)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:761px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{font-size:17px}
.sheet .body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fg .full{grid-column:1/-1}
details.adv{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
details.adv summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700;font-size:13px;color:var(--primary)}
details.adv[open]{padding-bottom:14px}
.err{background:var(--err-bg);color:var(--err-fg);border-radius:10px;padding:10px 12px;font-size:14px}
.note{background:var(--hl);border:1px solid var(--hl-line);color:var(--label);border-radius:12px;padding:12px 14px;font-size:13px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--tile)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumbs button{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.big img{width:100%;border-radius:10px;display:block}
.cost{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.cost .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.cost>span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.est{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-fg);background:var(--warn-bg);padding:1px 8px;border-radius:99px;margin-left:6px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--toast);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 35px #0002;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
textarea.out{font-family:var(--f-mono);font-size:12px;min-height:200px;white-space:pre}
.morelist{display:grid;gap:8px}
.morelist .btn{justify-content:flex-start;min-height:52px;font-size:15px}
#printArea{display:none}
.pv{background:#fff;color:#000;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px;line-height:1.6}.pv h1{font-size:18px;margin:0 0 4px}.pv .pmeta{color:#444;margin-bottom:10px;font-size:12px}.pv table{min-width:0;width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:12px}.pv td{border:1px solid #bbb;padding:4px 6px;vertical-align:top;color:#000}.pv p{margin:3px 0;white-space:pre-wrap}.pv p.ind{margin-left:16px;color:#333}.pv img{border-radius:0}
.pgrid{display:grid;gap:8px;margin:8px 0 14px}.pgrid.g1{grid-template-columns:1fr}.pgrid.g2,.pgrid.g4{grid-template-columns:1fr 1fr}.pgrid.g3{grid-template-columns:repeat(3,1fr)}.pgrid .pgc{background:#F3F5F2;border:1px solid #D5DBD5;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;height:170px}.pgrid.g1 .pgc{height:300px}.pgrid.g3 .pgc{height:140px}.pv table.kv td:nth-child(odd){color:#555;width:19%}.pv table.k2 td:nth-child(odd){width:30%}.pgrid .pgc img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
@media print{
  html,body{background:#fff!important;color:#000!important}
  .app,.mobilebar,.fab,#modal,.toast,.scrim{display:none!important}
  #printArea{display:block;font:12px/1.6 var(--f-body);color:#000}
  #printArea h1{font-size:20px;margin:0 0 4px}
  #printArea .pmeta{color:#444;margin-bottom:12px;font-size:11px}
  #printArea table{min-width:0;width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:11px}
  #printArea td{border:1px solid #bbb;padding:4px 6px;vertical-align:top}
  #printArea p{margin:3px 0;white-space:pre-wrap}
  #printArea p.ind{margin-left:16px;color:#333;font-size:11px}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:761px){.fab{display:none!important}}
@media(max-width:760px){
  .sheet footer .btn{flex:1 1 40%;min-height:50px;font-size:15px}
  .sheet footer .btn.primary{flex:2 1 55%}
  .sidebar{display:none}
  .main{margin-left:0;width:100%}
  .topbar{height:56px;padding-inline:16px;gap:10px}
  .tb-brand{display:none}
  .gsearch{max-width:none;margin-left:0}
  .content{padding:18px 16px 130px}
  .pagehead h1{font-size:24px}
  .pagehead .addbtn{display:none}
  .kpis{gap:10px}.kpi{padding:14px}.kpi b{font-size:22px}
  .panel{padding:16px}
  .mobilebar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom,0px));z-index:35}
  .mobilebar button{display:grid;place-items:center;gap:1px;color:var(--navmute);background:none;border:0;padding:5px 1px;font-size:11px;min-height:48px;cursor:pointer}
  .mobilebar button[aria-current="page"]{color:var(--primary);font-weight:800}
  .mobilebar .em{font-size:20px;line-height:1.1}
  .status{font-size:11px;padding:3px 8px}
}
</style>

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('foshan-sourcing',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

const PH={},PT={},PB={};/* PH full url, PT thumb url, PB {full:Blob,thumb:Blob|null} */
const ph=id=>PH[id]||'';const pt=id=>PT[id]||PH[id]||'';
function idbTx(store,mode,fn){return idb().then(d=>new Promise((res,rej)=>{const t=d.transaction(store,mode);let out;try{out=fn(t.objectStore(store))}catch(e){rej(e);return}t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
const photoPut=(id,rec)=>idbTx('photos','readwrite',s=>{s.put(rec,id)});
const photoDel=id=>idbTx('photos','readwrite',s=>{s.delete(id)});
async function photoAll(){const d=await idb();return new Promise((res,rej)=>{const out={};const c=d.transaction('photos').objectStore('photos').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
function photoLoad(id,rec){const o=PH[id];if(o)URL.revokeObjectURL(o);if(PT[id])URL.revokeObjectURL(PT[id]);PB[id]=rec;PH[id]=URL.createObjectURL(rec.full);PT[id]=rec.thumb?URL.createObjectURL(rec.thumb):''}
function photoFree(id){if(PH[id])URL.revokeObjectURL(PH[id]);if(PT[id])URL.revokeObjectURL(PT[id]);delete PH[id];delete PT[id];delete PB[id]}
async function dataToBlob(u){return (await fetch(u)).blob()}

async function loadPhotos(){/* returns number of legacy photos migrated */
  const raw=await photoAll();let n=0;
  for(const [id,v] of Object.entries(raw)){
    if(typeof v==='string'){try{const full=await dataToBlob(v);const rec={full,thumb:await makeThumb(full)};photoLoad(id,rec);await photoPut(id,rec);n++}catch(e){}}
    else if(v&&v.full)photoLoad(id,v)}
  return n}
async function convertPhotos(o){let n=0;for(const list of [o.products||[],o.stores||[]]){for(const x of list){if(!x.photos)continue;for(let i=0;i<x.photos.length;i++){const v=x.photos[i];if(typeof v==='string'&&v.startsWith('data:')){const id=uid();const full=await dataToBlob(v);const rec={full,thumb:await makeThumb(full)};photoLoad(id,rec);await photoPut(id,rec);x.photos[i]=id;n++}}}}return n}
function loadImg(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('อ่านรูปไม่ได้'))};im.src=u})}
async function scaleBlob(b,max,q){const im=await loadImg(b);const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error('สร้างรูปไม่ได้')),'image/jpeg',q))}
async function makeThumb(b){try{return await scaleBlob(b,480,.7)}catch(e){return null}}

/* ---- exchange rates & costing (estimates only) ---- */
function rateOf(c){if(c==='THB')return 1;const r=S.rates[c];return r&&r.rate>0?r.rate:null}
function toTHB(a,c){const r=rateOf(c||'CNY');return r==null?null:a*r}
const effFreight=p=>(p.freight!==''&&p.freight!=null&&num(p.freight)>0)?num(p.freight):((S.set&&S.set.freightPerCbm>0&&num(p.cbm)>0)?num(p.cbm)*S.set.freightPerCbm:0);
const effDuty=p=>(p.duty!==''&&p.duty!=null)?num(p.duty):((S.set&&S.set.dutyDefault)||0);
function cost(p){
  const price=num(p.agreed)||num(p.quote);const r=rateOf(p.currency||'CNY');
  if(!price||r==null)return null;
  const base=price*r;const dutyPct=effDuty(p),freight=effFreight(p);
  const landed=base*(1+dutyPct/100)+num(p.inland)+freight+num(p.other);
  const t=num(p.target);
  return{price,base,dutyPct,freight,duty:base*dutyPct/100,landed,profit:t?t-landed:null,margin:t?(t-landed)/t:null,target:t}
}
function balOf(pid){
  let on=0,res=0;const wh={};
  for(const m of S.moves){if(m.pid!==pid)continue;
    if(m.type==='reserve')res+=m.qty;else if(m.type==='release')res-=m.qty;
    else{on+=m.qty;wh[m.wh||'คลังหลัก']=(wh[m.wh||'คลังหลัก']||0)+m.qty}}
  return{on,res,av:on-res,wh}
}

function field(f,v){
  const val=v??'';const id='f_'+f.k;const cls=f.full?'f full':'f';
  let ctl;
  if(f.t==='select')ctl=`<select id="${id}" name="${f.k}">${(f.opts||[]).map(o=>{const ov=typeof o==='object'?o.v:o,ol=typeof o==='object'?o.l:o;return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea')ctl=`<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else if(f.t==='checkbox')return `<label class="${cls}" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="${id}" name="${f.k}" ${val?'checked':''}><span>${esc(f.l)}</span></label>`;
  else ctl=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="decimal" step="any"':''} value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`;
  return `<label class="${cls}" for="${id}">${esc(f.l)}${f.req?' *':''}${ctl}</label>`;
}

    ${k(S.products.length,'สินค้าทั้งหมด',`สนใจ ${cnt('สนใจ')} · ต่อรอง ${cnt('ต่อรอง')}`)}
    ${k(S.comp.length,'ราคาคู่แข่งที่ติดตาม',`รอยืนยัน ${S.comp.filter(c=>c.status!=='ยืนยันแล้ว').length}`)}
    ${k(poWait,'PO รออนุมัติ',`ค้างรับของ ${poOpen} ใบ`)}
    ${k(inTr,'ขนส่งระหว่างทาง','จีน → ไทย')}
    ${k(low.length,'สต๊อกใกล้หมด','ตามค่าขั้นต่ำที่ตั้ง')}
    ${k(inv?'฿'+fmt(inv):'—','มูลค่าสต๊อก (ประมาณการ)',missing?`${missing} รายการยังคำนวณต้นทุนไม่ได้`:'ต้นทุนนำเข้าโดยประมาณ')}
    ${k(avgM==null?'—':fmt(avgM*100,1)+'%','กำไรขั้นต้นเฉลี่ย (ประมาณการ)',costed.length?`จาก ${costed.length} รายการ`:'ใส่ราคาขายเป้าหมายในสินค้า')}
    ${k(budget?'฿'+fmt(budget):'—','งบสั่งซื้อประมาณการ (สนใจ+ต่อรอง)',`CBM รวม ${fmt(cbmSum,1)} · ${bn} รายการ${bmiss?` · ${bmiss} คำนวณไม่ได้`:''}`)}
  </div>
  <div class="two">
    <section class="panel"><h3>ต้องดูแลตอนนี้</h3>${attn.join('')||'<div class="empty">ไม่มีรายการค้าง</div>'}</section>

function filtered(){

}
function sortedProds(list){
  const key=ui.sort;
  const L=[...list];
  if(key==='landed')return L.sort((a,b)=>{const x=cost(a),y=cost(b);return (x?x.landed:1e15)-(y?y.landed:1e15)});
  if(key==='margin')return L.sort((a,b)=>{const x=cost(a),y=cost(b);return ((y&&y.margin!=null)?y.margin:-9)-((x&&x.margin!=null)?x.margin:-9)});
  if(key==='price')return L.sort((a,b)=>num(a.agreed||a.quote)-num(b.agreed||b.quote));
  return L.reverse();
}

const SEG=['เจ้าของบ้าน','ครอบครัว','คอนโด / หอพัก','โครงการ / สำนักงาน','อื่นๆ'];
function brandStats(){
  const sv=S.brand.surveys,n=sv.length;
  const un=sv.filter(s=>/intrend|อินเทรนด์|อินเทรน/i.test(s.unaided||'')).length;
  const asked=sv.filter(s=>s.aided==='รู้จัก'||s.aided==='ไม่รู้จัก');
  const aid=asked.filter(s=>s.aided==='รู้จัก').length;
  const cons=sv.filter(s=>num(s.consider)>0);
  const avg=cons.length?cons.reduce((a,s)=>a+num(s.consider),0)/cons.length:null;
  const tally={};sv.forEach(s=>{const k=(s.unaided||'').trim().toLowerCase();if(k)tally[k]=(tally[k]||0)+1});
  return{n,un,aid,asked:asked.length,avg,top:Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
function vBrand(){
  const b=brandStats(),sv=[...S.brand.surveys].reverse(),bn=[...S.brand.bench].reverse();
  const pct=(a,t)=>t?fmt(a/t*100,1)+'%':'—';
  const k=(n,l,s)=>`<div class="kpi"><b>${n}</b><span>${l}</span>${s?`<small>${s}</small>`:''}</div>`;
  const warn=b.n<30?`<div class="note">${b.n?`มี ${b.n} ตัวอย่าง น้อยเกินกว่าจะสรุปเป็นภาพรวมแบรนด์`:'ยังไม่มีแบบสำรวจ กด "＋ บันทึกแบบสำรวจ" ต่อหนึ่งคนที่ถาม'} แผนวิจัยที่ออกแบบไว้คือประมาณ 400 ตัวอย่าง ตัวเลขด้านล่างเป็นผลจากข้อมูลที่กรอกจริงเท่านั้น</div>`:'';
  const surveys=sv.length?`<div class="scroll panel" style="padding:0"><table><thead><tr><th>รหัส</th><th>วันที่ / พื้นที่</th><th>กลุ่ม</th><th>ร้านแรกที่นึกถึง</th><th>รู้จัก Intrend</th><th class="r">พิจารณา (1-5)</th><th></th></tr></thead><tbody>${sv.map(s=>`<tr><td class="mono">${esc(s.code)}</td><td>${esc(s.date)}<div class="small muted">${esc(s.area||'')}</div></td><td>${esc(s.segment||'')}<div class="small muted">${esc(s.budget||'')}</div></td><td>${esc(s.unaided||'—')}</td><td>${esc(s.aided||'—')}</td><td class="r">${s.consider||'—'}</td><td><button class="btn sm" data-act="edit-survey" data-id="${s.id}">แก้ไข</button></td></tr>`).join('')}</tbody></table></div>`:'';
  const bench=bn.length?bn.map(x=>`<div class="item"><div class="hd"><div><div class="nm" style="font-weight:700">${esc(x.brand)}</div><div class="muted small">${esc(x.place||'')}${x.date?' · '+esc(x.date):''}</div></div><button class="btn sm" data-act="edit-bench" data-id="${x.id}">แก้ไข</button></div>${[['Brand Identity',x.identity],['Showroom',x.showroom],['Service / After-sales',x.service],['Omnichannel',x.omni],['อื่นๆ',x.notes]].filter(r=>r[1]).map(r=>`<div class="small"><b>${r[0]}:</b> ${esc(r[1])}</div>`).join('')||'<div class="small muted">ยังไม่มีบันทึก</div>'}</div>`).join(''):`<div class="panel"><div class="empty">ยังไม่มี Benchmark แบรนด์จีน (เช่น KUKA Home, LINSY, YESWOOD, Louvre, Sunlink, Red Star Macalline) กด "＋ Benchmark แบรนด์จีน" ตอนเดินโชว์รูม</div></div>`;
  return `${warn}<div class="kpis">${k(b.n,'ตัวอย่างที่สำรวจ','')}${k(pct(b.un,b.n),'นึกถึง Intrend เองก่อน (unaided)',b.n?b.un+' จาก '+b.n+' คน':'')}${k(pct(b.aid,b.asked),'รู้จักเมื่อถูกถามชื่อ (aided)',b.asked?b.aid+' จาก '+b.asked+' คน':'')}${k(b.avg==null?'—':fmt(b.avg,1),'ความตั้งใจซื้อเฉลี่ย (1-5)','')}</div>
  ${b.top.length?`<section class="panel"><h3>ร้านที่ถูกนึกถึงเป็นอันดับแรก</h3>${b.top.map(t=>`<div class="row"><span>${esc(t[0])}</span><span class="num"><b>${t[1]}</b> คน</span></div>`).join('')}</section>`:''}
  ${surveys}
  <div class="sec-h" style="margin-top:8px"><h2>China Brand Benchmark</h2></div>${bench}`;
}

function reportText(k){
  const d=new Date().toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});const L=[];
  const H=t=>{L.push('INTREND · '+t);L.push('วันที่ '+d+(S.demo?' · (ข้อมูลตัวอย่าง)':''));L.push('')};
  const money0=n=>n==null?'—':'฿'+fmt(n);
  if(k==='exec'){H('Executive Summary');
    L.push(`ร้านที่สำรวจ: ${S.stores.filter(s=>s.visited).length}/${S.stores.length}`);
    L.push(`สินค้า: ${S.products.length} (สนใจ ${S.products.filter(p=>p.status==='สนใจ').length} · ต่อรอง ${S.products.filter(p=>p.status==='ต่อรอง').length} · สั่งแล้ว ${S.products.filter(p=>p.status==='สั่งแล้ว').length} · มีปัญหา ${S.products.filter(p=>p.status==='มีปัญหา').length})`);
    L.push(`PO: ${S.pos.length} ใบ (รออนุมัติ ${S.pos.filter(p=>p.status==='รออนุมัติ').length} · ค้างรับของ ${S.pos.filter(p=>p.status==='สั่งซื้อแล้ว').length})`);
    L.push(`ขนส่งระหว่างทาง: ${S.ships.filter(s=>['ออกจากจีนแล้ว','ระหว่างขนส่ง','ถึงด่าน/ศุลกากร'].includes(s.status)).length}`);
    L.push(`ราคาคู่แข่งที่ติดตาม: ${S.comp.length} · แบบสำรวจแบรนด์: ${S.brand.surveys.length} ตัวอย่าง`);
    const cs=S.products.map(p=>cost(p)).filter(c=>c&&c.margin!=null);
    L.push(cs.length?`กำไรขั้นต้นเฉลี่ย (ประมาณ): ${fmt(cs.reduce((a,c)=>a+c.margin,0)/cs.length*100,1)}% จาก ${cs.length} รายการ`:'กำไรขั้นต้น: ยังคำนวณไม่ได้ (ต้องมีราคา เรท และราคาขายเป้าหมาย)');}
  else if(k==='src'){H('Sourcing Report');
    S.products.forEach(p=>{const c=cost(p);L.push(`${p.sku} | ${p.name} | ${storeName(p.storeId)} | ${p.status}`);L.push(`  เสนอ ${p.quote===''||p.quote==null?'—':p.quote} ${p.currency||'CNY'} · ต่อรอง ${p.agreed===''||p.agreed==null?'—':p.agreed} · MOQ ${p.moq||'—'}${c?` · ต้นทุนถึงไทย ≈ ${money0(c.landed)} (ประมาณ)${c.margin!=null?` · กำไรประมาณ ${fmt(c.margin*100,1)}%`:''}`:' · ต้นทุน: ยังคำนวณไม่ได้'}`)});
    if(!S.products.length)L.push('ยังไม่มีสินค้า');}
  else if(k==='mkt'){H('Thai Market Report');
    S.comp.forEach(c=>{const p=prodOf(c.pid),kk=p?cost(p):null;L.push(`${c.name} | ${c.channel||'—'} | ${money0(num(c.price))} | ${c.status} | ${c.date||''}${c.source?' | '+c.source:''}`);if(kk)L.push(`  เทียบสินค้าเรา ${p.sku}: ต้นทุนประมาณ ${money0(kk.landed)} · กำไรถ้าขายเท่าคู่แข่ง ${fmt((num(c.price)-kk.landed)/num(c.price)*100,1)}% (ประมาณ)`)});
    if(!S.comp.length)L.push('ยังไม่มีข้อมูลคู่แข่ง');}
  else if(k==='brand'){H('Brand Research');const b=brandStats();
    L.push(`ตัวอย่าง ${b.n} · นึกถึง Intrend ก่อน ${b.n?fmt(b.un/b.n*100,1)+'%':'—'} (${b.un}) · รู้จักเมื่อถูกถาม ${b.asked?fmt(b.aid/b.asked*100,1)+'%':'—'} · พิจารณาเฉลี่ย ${b.avg==null?'—':fmt(b.avg,1)}`);
    if(b.n<30)L.push('หมายเหตุ: ตัวอย่างน้อย ยังสรุปภาพรวมแบรนด์ไม่ได้');
    b.top.forEach(t=>L.push(`  - ${t[0]}: ${t[1]} คน`));L.push('');
    S.brand.bench.forEach(x=>{L.push(`[Benchmark] ${x.brand} · ${x.place||''} ${x.date||''}`);[['Identity',x.identity],['Showroom',x.showroom],['Service',x.service],['Omnichannel',x.omni],['Notes',x.notes]].forEach(r=>{if(r[1])L.push('  '+r[0]+': '+r[1])})});}
  else if(k==='inv'){H('Inventory Report (คลังไทย)');
    S.products.forEach(p=>{const b=balOf(p.id);if(b.on||b.res)L.push(`${p.sku} | ${p.name} | คงเหลือ ${b.on} · จอง ${b.res} · ขายได้ ${b.av}${S.min[p.id]?` · ขั้นต่ำ ${S.min[p.id]}`:''}`)});
    if(!S.moves.length)L.push('ยังไม่มีการเคลื่อนไหวสต๊อก');}
  else{H('PO & Shipments');
    S.pos.forEach(po=>{L.push(`${po.no} | ${storeName(po.storeId)} | ${po.status} | ยอด ${fmt(poTotal(po),2)} ${po.currency} | จ่ายแล้ว ${fmt(num(po.paid),2)} | ค้าง ${fmt(poTotal(po)-num(po.paid),2)}`)});
    L.push('');S.ships.forEach(s=>L.push(`${s.ref} | ${s.provider||'—'} | ${s.status} | ETD ${s.etd||'—'} · ETA ${s.eta||'—'} | ${s.cartons||'—'} กล่อง · ${s.cbm||'—'} CBM`));
    if(!S.pos.length&&!S.ships.length)L.push('ยังไม่มีข้อมูล');}
  return L.join('\n');
}

/* PDF: draw the document with the browser (so Thai renders), cut into A4 pages at row boundaries, wrap in a minimal PDF */
async function buildPdf(docHtml){
  if(!window.html2canvas)throw new Error('no renderer');
  const host=document.createElement('div');host.className='pv';
  host.style.cssText='position:fixed;left:-10000px;top:0;width:714px;border:0;border-radius:0;padding:0;background:#fff;color:#000;font-size:14px';
  host.innerHTML=docHtml;document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r})));
    const SC=2,PGH=1043;
    const hr=host.getBoundingClientRect();
    const bl=[...host.querySelectorAll('h1,.pmeta,tr,p,img')].map(e=>{const r=e.getBoundingClientRect();return{t:r.top-hr.top,b:r.bottom-hr.top}});
    const full=await window.html2canvas(host,{scale:SC,backgroundColor:'#fff',logging:false,useCORS:true,scrollX:0,scrollY:0});
    const total=Math.ceil(hr.height);const cuts=[0];let y=0;
    while(total-y>PGH){const lim=y+PGH;let brk=0;for(const b of bl){if(b.b<=lim&&b.t>y&&b.b>brk)brk=b.b}if(brk<=y+40)brk=lim;cuts.push(brk);y=brk}
    cuts.push(total+3);
    const pages=[];
    for(let i=0;i<cuts.length-1;i++){
      const y0=Math.round(cuts[i]*SC),y1=Math.min(full.height,Math.round(cuts[i+1]*SC));if(y1<=y0)continue;
      const c=document.createElement('canvas');c.width=794*SC;c.height=1123*SC;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(full,0,y0,full.width,y1-y0,40*SC,40*SC,full.width,y1-y0);
      x.fillStyle='#888';x.font=(10*SC)+'px "Noto Sans Thai",system-ui,sans-serif';x.textAlign='center';x.fillText('Foshan Sourcing · หน้า '+(pages.length+1)+' / '+(cuts.length-1),c.width/2,(1123-18)*SC);
      const b64=c.toDataURL('image/jpeg',.88).split(',')[1];const bin=atob(b64);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
      pages.push({data:u,w:c.width,h:c.height});
    }
    return makePdf(pages);
  }finally{host.remove()}
}
function makePdf(jp){
  const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(i,fn)=>{offs[i]=len;push(i+' 0 obj\n');fn();push('\nendobj\n')};
  const n=jp.length;push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+jp.map((_,k)=>(3+3*k)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  jp.forEach((j,k)=>{const p=3+3*k,c=p+1,im=p+2;
    obj(p,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+c+' 0 R >>'));
    const cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(c,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(im,()=>{push('<< /Type /XObject /Subtype /Image /Width '+j.w+' /Height '+j.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.data.length+' >>\nstream\n');push(j.data);push('\nendstream')});
  });
  const xr=len,tot=3+3*n;push('xref\n0 '+tot+'\n0000000000 65535 f \n');
  for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<< /Size '+tot+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

function printDoc(title,text,imgs,fname,kv){

function parseImport(txt){
  let d;try{d=JSON.parse(txt)}catch(_){return{err:'อ่าน JSON ไม่ได้ ตรวจว่าคัดลอกมาครบ'}}
  if(!d||!Array.isArray(d.stores)||!Array.isArray(d.products))return{err:'ไม่พบ stores / products ในไฟล์นี้'};
  const legacy=d.app!=='foshan-sourcing';
  const out={legacy,stores:[],products:[],pos:d.pos||[],ships:d.ships||[],moves:d.moves||[],comp:d.comp||[],brand:d.brand||{surveys:[],bench:[]},min:d.min||{},rates:d.rates||null,set:d.set||null};
  const idMap={};
  d.stores.forEach((s,i)=>{const id=legacy?uid():s.id;idMap[s.id]=id;out.stores.push(legacy?{id,legacyId:s.id,order:s.order||i+1,zone:s.zone||'',name:s.name||'(ไม่มีชื่อ)',address:s.address||'',contact:s.contact||'',terms:'',rating:'',notes:s.notes||'',visited:!!s.visited,photos:[]}:s)});
  let missing=0;const skus={};let dup=0;let photos=0;
  d.products.forEach(p=>{
    const sid=idMap[p.storeId];if(!sid)missing++;
    const q=legacy?{id:uid(),legacyId:p.id,sku:p.sku||'',supplierCode:'',storeId:sid||'',name:p.name||'',nameEn:'',nameZh:'',category:p.category||'',status:p.status||'ใหม่',currency:'CNY',quote:p.quote??'',agreed:p.agreed??'',moq:p.moq??'',qty:p.quantity??'',stock:p.stock??'',stockDate:p.stockDate||'',dims:'',weight:'',cbm:'',inland:'',freight:'',duty:'',other:'',target:'',notes:[p.spec,p.notes].filter(Boolean).join('\n'),fav:false,photos:p.photos||[],hist:[]}:p;
    const k=(q.sku||'').toLowerCase();if(k&&skus[k])dup++;skus[k]=1;photos+=(q.photos||[]).length;out.products.push(q)});
  out.report={stores:out.stores.length,products:out.products.length,photos,missing,dup,pos:out.pos.length,moves:out.moves.length,legacy};
  return out;
}
function mergeImport(o,replace){
  if(replace){S.stores=o.stores;S.products=o.products;S.pos=o.pos;S.ships=o.ships;S.moves=o.moves;S.comp=o.comp;S.brand=o.brand;S.min=o.min;if(o.rates)S.rates=o.rates;if(o.set)S.set=o.set;}
  else{
    const hasS=new Set(S.stores.map(s=>s.id).concat(S.stores.map(s=>s.legacyId).filter(Boolean)));
    o.stores.forEach(s=>{if(!hasS.has(s.id)&&!(s.legacyId&&hasS.has(s.legacyId)))S.stores.push(s)});
    const hasP=new Set(S.products.map(p=>p.id).concat(S.products.map(p=>p.legacyId).filter(Boolean)));
    const skus=new Set(S.products.map(p=>(p.sku||'').toLowerCase()));
    o.products.forEach(p=>{if(hasP.has(p.id)||(p.legacyId&&hasP.has(p.legacyId)))return;if(p.sku&&skus.has(p.sku.toLowerCase()))p.sku=p.sku+'-IMP';S.products.push(p)});
    const hasPO=new Set(S.pos.map(x=>x.id));o.pos.forEach(x=>{if(!hasPO.has(x.id))S.pos.push(x)});
    const hasSh=new Set(S.ships.map(x=>x.id));o.ships.forEach(x=>{if(!hasSh.has(x.id))S.ships.push(x)});
    const hasM=new Set(S.moves.map(x=>x.id));o.moves.forEach(x=>{if(!hasM.has(x.id))S.moves.push(x)});
    const hasC=new Set(S.comp.map(x=>x.id));o.comp.forEach(x=>{if(!hasC.has(x.id))S.comp.push(x)});
    const hasSv=new Set(S.brand.surveys.map(x=>x.id));(o.brand.surveys||[]).forEach(x=>{if(!hasSv.has(x.id))S.brand.surveys.push(x)});
    const hasB=new Set(S.brand.bench.map(x=>x.id));(o.brand.bench||[]).forEach(x=>{if(!hasB.has(x.id))S.brand.bench.push(x)});
  }
  S.demo=false;
}

    case 'export-json-photos':{toast('กำลังรวมรูป…');showExport('สำรองข้อมูลรวมรูป',await backupText(true),'ไฟล์รวมรูปต้นฉบับอาจใหญ่มาก (หลายสิบ MB) แนะนำ "ดาวน์โหลด" หรือ "แชร์" แทนคัดลอก ถ้าไม่สำเร็จให้ใช้แบบไม่รวมรูป','','foshan-backup-photos-'+today()+'.json',true);break}
    case 'csv':showExport('ส่งออก CSV','﻿'+csvFor(el.dataset.k),null,'',el.dataset.k+'-'+today()+'.csv');break;
    case 'copy':{const t=$('#outText');if(bigText!=null){toast('ไฟล์ใหญ่เกินกว่าจะคัดลอก ใช้ "ดาวน์โหลด" หรือ "แชร์"');break}try{await navigator.clipboard.writeText(t.value);toast('คัดลอกแล้ว');markBackup(t)}catch(_){t.select();toast('เลือกข้อความแล้ว กดคัดลอกเอง')}break}
    case 'dl':{const t=$('#outText');const fn=t.dataset.fn||'export.txt';const r=await saveFile(fn,exText());toast(saveMsg(r,fn));if(r==='ok')markBackup(t);break}
    case 'share':{const t=$('#outText');const fn=t.dataset.fn||'export.txt';try{if(navigator.share){let sent=false;if(navigator.canShare){const f=new File([exText()],fn,{type:mimeOf(fn)});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});sent=true}}if(!sent)await navigator.share({title:fn,text:exText()});markBackup(t)}else toast('เครื่องนี้ไม่รองรับแชร์ ใช้ดาวน์โหลดหรือคัดลอกแทน')}catch(err){if(!err||err.name!=='AbortError')toast('แชร์ไม่สำเร็จ ใช้ดาวน์โหลดหรือคัดลอกแทน')}break}
    case 'shrink-photos':{if(!el.dataset.sure){el.dataset.sure='1';el.textContent='กดอีกครั้งเพื่อยืนยัน (รูปต้นฉบับที่ใหญ่กว่า 1600px จะถูกย่อถาวร)';break}
      el.disabled=true;el.textContent='กำลังลดขนาด…';const before=photoStats().bytes;let n=0;
      for(const [id,rec] of Object.entries(PB)){try{const nb=await scaleBlob(rec.full,1600,.85);if(nb.size<rec.full.size){const nr={full:nb,thumb:rec.thumb||await makeThumb(nb)};await photoPut(id,nr);photoLoad(id,nr);n++}}catch(e){}}
      render();toast('ลดขนาดแล้ว '+n+' รูป ประหยัด '+mb(Math.max(0,before-photoStats().bytes)));break}
    case 'save-calc':{S.set={freightPerCbm:num($('#fpc').value),dutyDefault:num($('#dd').value)};commit('ตั้งค่าต้นทุนตั้งต้น');toast('บันทึกค่าตั้งต้นแล้ว');break}
    case 'import':importModal();break;
    case 'imp-check':{const r=parseImport($('#impText').value);if(r.err){formErr(r.err);break}pending=r;const p=r.report;$('#impRep').innerHTML=`<div class="note"><b>รายงานก่อนนำเข้า</b><br>ร้านค้า ${p.stores} · สินค้า ${p.products} · รูป ${p.photos} · PO ${p.pos} · เคลื่อนไหวสต๊อก ${p.moves}<br>${p.missing?`สินค้าที่ไม่พบร้านต้นทาง ${p.missing} รายการ (ต้องเลือกร้านใหม่เอง)<br>`:''}${p.dup?`SKU ซ้ำภายในไฟล์ ${p.dup} รายการ<br>`:''}${p.legacy?'ไฟล์เวอร์ชันเก่า: สต๊อกเดิมจะเก็บเป็นสต๊อกที่ซัพพลายเออร์ ไม่ใช่คลังไทย':'ไฟล์สำรองจากระบบนี้'}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn primary" data-act="imp-merge">ผสานกับข้อมูลปัจจุบัน</button><button class="btn danger" data-act="imp-replace">แทนที่ข้อมูลทั้งหมด</button></div>`;formErr('');break}
    case 'imp-merge':case 'imp-replace':{if(!pending)break;try{await convertPhotos(pending)}catch(_){}mergeImport(pending,a==='imp-replace');pending=null;closeModal();commit('นำเข้าข้อมูล ('+(a==='imp-replace'?'แทนที่':'ผสาน')+')');break}
  }
});
const markDirty=e=>{if(modalIsForm&&e.target.closest&&e.target.closest('#modal'))formDirty=true};
document.addEventListener('input',markDirty);document.addEventListener('change',markDirty);
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;$('#gsearch').value=ui.q;render()}
  else if(e.target.id==='gsearch'){ui.q=e.target.value;if(ui.q.trim()&&ui.tab!=='prod')ui.tab='prod';render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='storeF'){ui.store=t.value;render()}
  else if(t.id==='sortF'){ui.sort=t.value;render()}
  else if(t.id==='pq'){S.set=S.set||{};S.set.photoMode=t.value;commit('ตั้งคุณภาพรูป: '+(PHOTO_MODES[t.value]||{}).l);toast('ตั้งคุณภาพรูปแล้ว มีผลกับรูปที่เพิ่มต่อจากนี้')}
  else if(t.id==='themeSel'){S.theme=t.value;applyTheme();commit('เปลี่ยนธีม')}
  else if(t.dataset&&t.dataset.act==='minq'){S.min[t.dataset.id]=num(t.value);commit()}
  else if(t.dataset&&t.dataset.act==='agreed'){const p=prodOf(t.dataset.id);if(p){const v=t.value===''?'':num(t.value);if(v!==p.agreed){p.agreed=v;p.hist=[...(p.hist||[]),{d:today(),quote:p.quote,agreed:v}];commit('ต่อรอง '+p.sku+' ได้ '+(v===''?'—':v));toast('บันทึกราคาต่อรองแล้ว');prodDetail(p.id)}}}
  else if(t.classList&&t.classList.contains('r-pid')){const p=prodOf(t.value);const row=t.closest('.poRow');if(p&&!num($('.r-price',row).value))$('.r-price',row).value=num(p.agreed||p.quote)||''}
});
$('#fab').addEventListener('click',()=>ADD[ui.tab]?.());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML){const b=$('#modal footer [data-act=close]')||$('#modal header [data-act=close]');tryClose(b)}});
function netUi(){$('#net').hidden=navigator.onLine}
addEventListener('online',netUi);addEventListener('offline',netUi);

/* ---- boot ---- */
(async function(){
  netUi();
  let readErr='';try{S=await dbGet('state')}catch(e){S=null;readErr=String((e&&e.message)||e)}
  let legacyPh=0;try{legacyPh=await loadPhotos()}catch(e){}
  const fresh=!S;
  if(readErr){NOSAVE=true;STORE_WARN='อ่านที่เก็บข้อมูลของหน้านี้ไม่ได้ ('+readErr+') ระบบจะไม่บันทึกทับ และที่จดตอนนี้จะไม่ถูกเก็บ ให้เปิดใน Safari/Chrome ปกติ หรือนำเข้าไฟล์สำรองที่ ตั้งค่า → นำเข้า'}
  else if(fresh){let had=false;try{had=localStorage.getItem('fs-had-data')==='1'}catch(e){}if(had)STORE_WARN='ไม่พบข้อมูลเดิมในที่นี้ ทั้งที่เคยบันทึกไว้ อาจถูกเบราว์เซอร์หรือแอปล้างทิ้ง ให้กู้จากไฟล์สำรองที่ ตั้งค่า → นำเข้า'}
  if(!S)S=demoState();
  S.set=S.set||{freightPerCbm:0,dutyDefault:0};if(S.lastBackup===undefined)S.lastBackup=null;if(S.lastStore===undefined)S.lastStore=null;
  S.stores.forEach(x=>{if(!x.photos)x.photos=[]});
  let migrated=0;try{migrated=await convertPhotos(S)}catch(e){}
  if(!fresh)try{const used=new Set();[...S.products,...S.stores].forEach(x=>(x.photos||[]).forEach(i=>used.add(i)));Object.keys(PB).forEach(k=>{if(!used.has(k)){photoFree(k);photoDel(k).catch(()=>{})}})}catch(e){}
  S.log=S.log||[];S.ships=S.ships||[];S.min=S.min||{};S.comp=S.comp||[];S.brand=S.brand||{surveys:[],bench:[]};S.theme=S.theme||'light';applyTheme();
  render();
  if(fresh||migrated)save();else setSave('saved');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();

function fillEst(){const el=$('#stEst');if(!el)return;try{navigator.storage&&navigator.storage.estimate&&navigator.storage.estimate().then(e=>{const x=$('#stEst');if(x&&e&&e.quota)x.textContent='พื้นที่ของเบราว์เซอร์: ใช้ไป '+mb(e.usage||0)+' จากที่ได้ประมาณ '+mb(e.quota);if(navigator.storage.persisted)navigator.storage.persisted().then(v=>{x.textContent+=' · เก็บถาวร: '+(v?'ใช่':'ยังไม่ยืนยัน')}).catch(()=>{})}).catch(()=>{})}catch(e){}}
{const _render=render;render=function(){_render();fillEst()}}

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(function(){});
